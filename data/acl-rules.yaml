# Regeln, wie der Ingest aus Ablageort + Dokumentkopf die ACL eines Dokuments berechnet.
# Konzept: docs/BERECHTIGUNGSKONZEPT.md §6. Diese Datei ist Konfiguration, kein Code.
#
# Reihenfolge: 1 Site-Mitglieder des Ablageorts  ->  2 Label (vertraulichkeit)  ->  3 Verschärfung durch
# informationsdomaene  ->  4 Veröffentlichung  ->  5 Verteiler (empfaenger/verfasser)  ->  6 Mail-Sonderfall.
# Grundsatz: Label und Domäne dürfen nur VERSCHÄRFEN. Die einzige Erweiterung ist Regel 4 (Veröffentlichung).

classifications: [internal, confidential, restricted]   # aufsteigend

# 2. vertraulichkeit im Dokumentkopf
labels:
  intern:               {classification: internal}                                 # Zielgruppe = Site-Mitglieder
  C-Level:              {classification: confidential, audience: [grp-c-level]}
  Betriebsrat-intern:   {classification: confidential, audience: [grp-betriebsrat]}

# 3. informationsdomaene verschärft (max. Klassifikation, engere Zielgruppe)
informationsdomaene:
  hr-sensitiv:              {classification: restricted,   audience: [grp-hr-leitung, grp-gf]}   # restricted = namentlich, Existenz verborgen
  it-security-restricted:   {classification: confidential, audience: [grp-it-security]}
  br-intern:                {classification: confidential, audience: [grp-betriebsrat]}
  c-level-beirat:           {classification: confidential, audience: [grp-c-level]}
  # management, bereichsintern, projektintern, unternehmensweit, br-management-verhandlung: keine Verschärfung

# 4. Veröffentlichung: genau diese Domänenliste + Label intern => firmenweit lesbar (entspricht einer
#    "Veröffentlicht"-Bibliothek: Organigramme, Policies, SOPs). Einzige Regel, die Rechte erweitert.
published_if:
  informationsdomaene_exactly: [unternehmensweit]
  vertraulichkeit: intern
  audience: [grp-alle]

# 5. Verteiler: Wer im Kopf als verfasser oder empfaenger steht, darf lesen (Auflösung über permissions.yaml aliases).
distribution_fields: [verfasser, empfaenger]

# 6. Mailarchiv: keine Site-Mitglieder, ausschließlich Verteiler; immer vertraulich.
mail:
  ablageort: mailarchiv
  classification: confidential
  audience_from: [verfasser, empfaenger]

# Deny by default: Ablageort ohne .acl.yaml => site_members: [] => nur Verteiler und Veröffentlichtes.
