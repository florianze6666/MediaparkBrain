{% extends "layout.html" %}
{% block title %}{{ page.title if page else "Start" }}{% endblock %}
{% block content %}
  {% if page %}
    <div class="page-header">
      <h1>{{ page.title }}</h1>
      <div class="page-actions">
        <a href="/wiki/{{ page.slug }}/edit">Bearbeiten</a>
        <form method="post" action="/wiki/{{ page.slug }}/delete" onsubmit="return confirm('Seite wirklich loeschen?');" style="display:inline">
          <button type="submit" class="link-btn">Löschen</button>
        </form>
      </div>
    </div>
    <article class="markdown-body">{{ content_html | safe }}</article>
  {% else %}
    <p>Noch keine Seiten vorhanden. <a href="/new">Erste Seite anlegen</a>.</p>
  {% endif %}
{% endblock %}
