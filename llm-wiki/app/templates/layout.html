<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LLM-Wiki{% endblock %} · MediaparkBrain</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
  <script>
    // Wird gerufen, sobald dem Nutzer neue Informationen bereitgestellt werden
    // (frische LLM-Antwort) - spricht "Yeah, Yeah!" laut aus.
    // Muss im <head> stehen, damit Aufrufe weiter unten im Content-Block
    // (der vor diesem Script-Tag im body gerendert wuerde) die Funktion
    // bereits definiert vorfinden.
    function yeahYeah() {
      try {
        const u = new SpeechSynthesisUtterance("Yeah, Yeah!");
        u.lang = "de-DE";
        u.pitch = 1.15;
        u.rate = 1.05;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      } catch (e) {
        // Web Speech API nicht verfuegbar - stumm weitermachen
      }
    }

    // Klatsch-Sound beim Speichern einer Seite - rein per Web Audio API
    // synthetisiert (kein Audio-Asset noetig): mehrere kurze gefilterte
    // Rauschstoesse, die wie Haendeklatschen klingen.
    function clapHands() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const clapTimes = [0, 0.09, 0.16];
        clapTimes.forEach((delay) => {
          const duration = 0.08;
          const bufferSize = ctx.sampleRate * duration;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const bandpass = ctx.createBiquadFilter();
          bandpass.type = "bandpass";
          bandpass.frequency.value = 1200;
          bandpass.Q.value = 0.7;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.9, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);

          noise.connect(bandpass).connect(gain).connect(ctx.destination);
          noise.start(ctx.currentTime + delay);
          noise.stop(ctx.currentTime + delay + duration);
        });
      } catch (e) {
        // Web Audio API nicht verfuegbar - stumm weitermachen
      }
    }
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><a href="/">MediaparkBrain<br>LLM-Wiki</a></div>
      <div class="user-select">
        <div class="user-select-label">Angemeldet als: <strong>{{ user_name }}</strong></div>
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ current_path }}">
          <select name="user" onchange="this.form.submit()" aria-label="Als Nutzer arbeiten">
            {% for u in users %}
            <option value="{{ u.id }}" {% if u.id == user %}selected{% endif %}>{{ u.name }}</option>
            {% endfor %}
          </select>
          <noscript><button type="submit" class="btn">Wechseln</button></noscript>
        </form>
      </div>
      <nav class="actions">
        <a href="/new" class="btn">+ Neue Seite</a>
        <button type="button" class="btn btn-magenta" onclick="document.getElementById('sidebar-file-upload').click()" title="Dokument auswählen und sofort hochladen">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Dokument Upload
        </button>
        <form id="sidebar-upload-form" method="post" action="/upload" enctype="multipart/form-data" style="display:none;">
          <input type="file" id="sidebar-file-upload" name="file" accept=".pdf,.docx,.doc,.xlsx,.xls,.md,.txt" onchange="document.getElementById('sidebar-upload-form').submit()">
        </form>
        <a href="/proposals/new" class="btn btn-proposal">+ Projektvorschlag einreichen</a>
        <a href="/ask" class="btn btn-ask">Frag das Wiki</a>
        <a href="/dashboard" class="btn btn-dashboard">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          Dashboards
        </a>
      </nav>

      <ul class="page-list">
        {% for p in pages %}
        <li class="{% if page and page.slug == p.slug %}active{% endif %}">
          <a href="/wiki/{{ p.slug }}">{{ p.title }}</a>
        </li>
        {% else %}
        <li class="empty">Noch keine Seiten</li>
        {% endfor %}
      </ul>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
