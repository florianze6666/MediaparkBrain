[project]
name = "llm-wiki"
version = "0.1.0"
description = "Minimales LLM-Wiki fuer MediaparkBrain: Markdown-Seiten + Retrieval + optionale Claude-Anbindung"
authors = [
    { name = "pronoow-cmd", email = "pronoow@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
