[project]
name = "llm-wiki"
version = "0.1.0"
description = "Minimales LLM-Wiki fuer MediaparkBrain: Markdown-Seiten + Retrieval + optionale LLM-Anbindung (OpenAI-kompatibler Endpoint)"
authors = [
    { name = "pronoow-cmd", email = "pronoow@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "openai>=1.0.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdf>=6.17.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]  # reportlab baut die Test-PDFs

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "security: Tests, die Zugriffsbeschraenkungen und Leak-Freiheit beweisen",
]
