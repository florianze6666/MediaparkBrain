[project]
name = "mpb"
version = "0.1.0"
description = "Mediapark Brain - enterprise-ready RAG mit Berechtigungen und Rollen-Agenten"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "anthropic>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
mpb = "mpb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mpb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "security: Leak-Tests, Pflicht gruen vor Merge",
  "llm: braucht ANTHROPIC_API_KEY",
]

[tool.ruff]
line-length = 110
